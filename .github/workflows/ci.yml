name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh git jq shellcheck curl

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install zsh git jq shellcheck || true

      - name: Install ShellSpec
        run: |
          curl -fsSL https://git.io/shellspec | sh -s -- --yes
          echo "$HOME/.local/lib/shellspec" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Ripwire
        run: |
          mkdir -p "$HOME/.local/bin"
          if [ "${{ runner.os }}" = "Linux" ]; then
            ARCH="linux-x64"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ARCH="macos-arm64"
          fi
          if [ -n "$ARCH" ]; then
            curl -fsSL "https://github.com/redhat-et/ripwire/releases/download/v0.6.5/ripwire-0.6.5-${ARCH}.tar.gz" | tar -xz -C "$HOME/.local/bin" --strip-components=1 "ripwire-0.6.5-${ARCH}/ripwire" || true
            chmod +x "$HOME/.local/bin/ripwire" 2>/dev/null || true
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ripwire" --version || true

      - name: Ripwire situational awareness
        run: ripwire . --situ || true

      - name: Run lint & quality gate
        run: ./scripts/lint

      - name: Master Specification Verification (All Gates)
        run: zsh test/verify_all.zsh

